<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Code Quest</title>
<style>
body{
  font-family:Arial;
  text-align:center;
  background:#111827;
  color:white;
}
button{
  width:80px;
  height:80px;
  font-size:30px;
  margin:5px;
}
#score{
  font-size:24px;
}
</style>
</head>
<body>

<h1>🎮 Code Quest</h1>
<h2>🐱 Pegue o Gatinho</h2>

<p id="score">Pontos: 0</p>

<div style="font-size:100px;" id="cat">🐱</div>

<button onclick="pegar()">PEGAR</button>

<script>
let pontos = 0;

function pegar(){
  pontos++;
  document.getElementById("score").innerHTML =
    "Pontos: " + pontos;

  const gatos = ["🐱","😺","😸","😻"];
  document.getElementById("cat").innerHTML =
    gatos[Math.floor(Math.random()*gatos.length)];
}
</script>

</body>
</html>
