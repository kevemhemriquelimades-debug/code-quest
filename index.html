<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Code Quest - Cobrinha</title>
<style>
body{
  background:#111827;
  color:white;
  text-align:center;
  font-family:Arial;
}
canvas{
  background:black;
  border:3px solid #22c55e;
  margin-top:20px;
}
</style>
</head>
<body>

<h1>🎮 Code Quest</h1>
<h2>🐍 Jogo da Cobrinha</h2>
<p>Use as setas do teclado para jogar.</p>

<canvas id="game" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let snake = [{x:10,y:10}];
let food = {x:15,y:15};
let dx = 1;
let dy = 0;

document.addEventListener("keydown", e=>{
 if(e.key==="ArrowUp"){dx=0;dy=-1;}
 if(e.key==="ArrowDown"){dx=0;dy=1;}
 if(e.key==="ArrowLeft"){dx=-1;dy=0;}
 if(e.key==="ArrowRight"){dx=1;dy=0;}
});

function draw(){
 ctx.clearRect(0,0,400,400);

 ctx.fillStyle="red";
 ctx.fillRect(food.x*20,food.y*20,20,20);

 ctx.fillStyle="lime";
 snake.forEach(part=>{
   ctx.fillRect(part.x*20,part.y*20,20,20);
 });

 let head={
   x:snake[0].x+dx,
   y:snake[0].y+dy
 };

 snake.unshift(head);

 if(head.x===food.x && head.y===food.y){
   food={
     x:Math.floor(Math.random()*20),
     y:Math.floor(Math.random()*20)
   };
 } else {
   snake.pop();
 }

 if(
   head.x<0 || head.y<0 ||
   head.x>=20 || head.y>=20
 ){
   alert("Fim de jogo!");
   snake=[{x:10,y:10}];
 }
}

setInterval(draw,150);
</script>

</body>
</html>
